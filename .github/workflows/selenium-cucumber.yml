# Runs the Cucumber + Selenium tests on every push and pull request, and by hand from the Actions tab.
# The public demo site blocks automated traffic from cloud servers, so the workflow starts its own copy of Toolshop
# with Docker (the official images of the Toolshop project) and tests that copy on http://localhost:4200.
name: Selenium + Cucumber tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SPRINT: sprint5            # which version of Toolshop the official compose file starts
  DISABLE_LOGGING: "true"
  # the official compose file, plus our two changes for GitHub's machines (see ci/toolshop.override.yml)
  COMPOSE_FILE: docker-compose.prod.yml:../ci/toolshop.override.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: selenium-cucumber
    steps:
      - uses: actions/checkout@v7

      - name: Get the Toolshop compose file and web server settings (official repository)
        uses: actions/checkout@v7
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop
          sparse-checkout: |
            docker-compose.prod.yml
            _docker/vhost.conf
          sparse-checkout-cone-mode: false

      - name: Start Toolshop in Docker
        working-directory: toolshop
        run: docker compose up -d --pull missing

      - name: Fill the database with its demo data
        working-directory: toolshop
        run: |
          for i in $(seq 1 30); do docker compose exec -T laravel-api php artisan migrate:fresh --seed --force && exit 0; echo "Database not ready ($i)"; sleep 5; done
          exit 1

      - name: Wait for the API and the web shop
        working-directory: toolshop
        run: |
          api=no; shop=no
          for i in $(seq 1 90); do
            curl -sf -o /dev/null "http://localhost:8091/products?page=1" && api=yes
            curl -sf -o /dev/null http://localhost:4200 && shop=yes
            [ "$api" = yes ] && [ "$shop" = yes ] && echo "API and shop are up" && exit 0
            echo "Waiting ($i): API $api, shop $shop"; sleep 5
          done
          docker compose ps; docker compose logs --tail 40 web laravel-api
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: selenium-cucumber/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chrome is already installed on GitHub's Ubuntu machines; Selenium Manager fetches the matching driver.
      - name: Run the scenarios (headless Chrome)
        run: npm test
        env:
          BASE_URL: http://localhost:4200

      # The HTML report (with a screenshot for every failed scenario) can be downloaded from the run page.
      - name: Upload the Cucumber report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: selenium-cucumber/reports/
          retention-days: 14

      - name: Show the Toolshop logs if something failed
        if: ${{ failure() }}
        working-directory: toolshop
        run: docker compose logs --tail 60
